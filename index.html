<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>playlist challenge</title>
</head>
<body>
    <div id="playlistframe">
     <div class="status-bar__column">
        <i class="fa-solid fa-x"></i>
        <span>Playlist</span>
     </div>
     <div class="main-song-bar__column">
        <div class="image">
        <i class="fa-regular fa-image"></i>
        </div>
        <div class="main-song__info">
         <span>Random Love</span>
         <span>by Divay kapoor</span>
        </div>
     </div>
     <div class="play-bar__column">
        <div class="btn__play">
          <i class="fa-solid fa-play"></i>
          <span>Play</span>
        </div>
        <div class="btn__heart">
        <i class="fa-regular fa-heart"></i>
        </div>
        <div class="btn__add">
        <i class="fa-solid fa-plus"></i>
        </div>       
     </div>
      <div class="sub-song-bar__column">
        <div class="song">
            <div class="red"></div>
            <div class="song__info">
             <span>Matargasti</span>
             <span>Mohit Chauhan</span>                
            </div>
        </div>
        <div class="song">
            <div class="pink"></div>
            <div class="song__info">
             <span>Attitude</span>
             <span>Lewis OfMan · Attitude</span>      
            </div>
        </div>
        <div class="song">
            <div class="blue"></div>
            <div class="song__info">
             <span>Try Everything</span>
             <span>Shakira · Zootopia</span>     
            </div>
        </div>
        <div class="song">
            <div class="mint"></div>
            <div class="song__info">
             <span>Sunflower</span>
             <span>Joseph Vincent · Sunflower</span>            
            </div>
        </div>                        


        

     
     </div>
    </div>
    </body>
<script src="https://kit.fontawesome.com/acccf4e870.js" crossorigin="anonymous"></script>
</html>
